name: Staging database

# Applies committed migrations to the staging project (bookone-hotel-staging,
# eu-west-1) after CI passes on main. Forward-only (binding rule 9): this
# pushes what is new and never resets, never seeds. The demo is seeded by hand
# (`pnpm demo:seed -- --staging`, docs/runbooks/staging.md).
#
# Production is not here and never will be in this file: it gets its own
# workflow, with a required reviewer, when the first pilot signs.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  push:
    name: apply migrations to staging
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI passed on, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configured?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::The staging environment is missing SUPABASE_ACCESS_TOKEN, SUPABASE_STAGING_DB_PASSWORD or the SUPABASE_STAGING_PROJECT_REF variable (docs/runbooks/staging.md)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - run: supabase link --project-ref "$PROJECT_REF"

      - name: Pending migrations
        run: supabase migration list --linked

      - run: supabase db push --linked --yes

      - name: Applied
        run: supabase migration list --linked
