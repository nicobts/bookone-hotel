# The OpenTelemetry Collector in front of every backend (ADR-036 §3).
#
# Services send OTLP here; this ships it on. Changing backends is an edit to
# this file, never a deploy of the services.
#
# The second line of ADR-036 §5: whatever a library adds, content attributes
# are dropped here before anything is stored — prompts, completions, message
# bodies, anything that looks like a request or response payload.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # ADR-036 §5, enforced where it cannot be forgotten.
  attributes/strip-content:
    actions:
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }
      - { key: gen_ai.input.messages, action: delete }
      - { key: gen_ai.output.messages, action: delete }
      - { key: gen_ai.system_instructions, action: delete }
      - { key: ai.prompt, action: delete }
      - { key: ai.prompt.messages, action: delete }
      - { key: ai.response.text, action: delete }
      - { key: ai.response.toolCalls, action: delete }
      - { key: http.request.body, action: delete }
      - { key: http.response.body, action: delete }
      - { key: url.query, action: delete }
      - { pattern: '^gen_ai\.(prompt|completion)\..*', action: delete }

  # Secrets inside URLs (the same rules as packages/telemetry/src/scrub.ts):
  # a guest's stay link is the credential to their stay.
  transform/scrub-urls:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(name, "/stay/v1[.][A-Za-z0-9._-]+", "/stay/{token}")
          - replace_all_patterns(attributes, "value", "/stay/v1[.][A-Za-z0-9._-]+", "/stay/{token}")
          - replace_pattern(name, "/pay/[A-Za-z0-9._-]{16,}", "/pay/{intent}")
          - replace_all_patterns(attributes, "value", "/pay/[A-Za-z0-9._-]{16,}", "/pay/{intent}")

  batch:
    timeout: 5s

exporters:
  # Where the data is stored: an EU backend (D9, ADR-029). Grafana Cloud's
  # OTLP gateway in an EU region, or the self-hosted stack — the endpoint and
  # credentials come from the environment, never this file.
  otlphttp:
    endpoint: ${env:OTEL_BACKEND_ENDPOINT}
    headers:
      Authorization: ${env:OTEL_BACKEND_AUTHORIZATION}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/strip-content, transform/scrub-urls, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/strip-content, batch]
      exporters: [otlphttp]
