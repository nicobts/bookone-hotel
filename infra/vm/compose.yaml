# The Phase 0 container set on the self-hosted EU VM (ADR-033).
#
# Guest data lives in Supabase EU; this host runs compute only. Three services
# of ours plus two edges:
#
#   caddy      public TLS, and it proxies ONLY /webhooks/* and /health to api.
#              /jobs/* is reached by apps/web over the tailnet or not at all.
#   tailscale  the only way in for staff: admin and the full api are served
#              on the tailnet (ADR-031, ADR-032 item 1).
#
# Secrets are injected by Infisical at `infisical run -- docker compose up`
# (ADR-032 item 3); nothing secret is written in this file or beside it.
#
#   infisical run --env=prod -- docker compose -f infra/vm/compose.yaml up -d

name: bookone

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  api:
    <<: *service
    image: ${REGISTRY:-bookone}/api:${TAG:-latest}
    environment:
      NODE_ENV: production
      # ADR-036: every service reports to the collector below.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      BOOKONE_ENVIRONMENT: ${BOOKONE_ENVIRONMENT:-prod}
      API_PORT: '8787'
      TRUST_PROXY: 'true'
      DATABASE_URL: ${DATABASE_URL:?}
      WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:?}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?}
      APP_URL: ${APP_URL:?}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WEBHOOK_BASE_URL: ${TWILIO_WEBHOOK_BASE_URL:-}
    expose: ['8787']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *service
    image: ${REGISTRY:-bookone}/worker:${TAG:-latest}
    environment:
      NODE_ENV: production
      # ADR-036: every service reports to the collector below.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      BOOKONE_ENVIRONMENT: ${BOOKONE_ENVIRONMENT:-prod}
      DATABASE_URL: ${DATABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      APP_URL: ${APP_URL:?}
      STAY_TOKEN_SECRET: ${STAY_TOKEN_SECRET:?}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:?}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL_SMALL: ${LLM_MODEL_SMALL:-}
      LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_REGION: ${TWILIO_REGION:-ie1}
      TWILIO_TEMPLATE_ESCALATION_ALERT: ${TWILIO_TEMPLATE_ESCALATION_ALERT:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WEBHOOK_BASE_URL: ${TWILIO_WEBHOOK_BASE_URL:-}
    # No ports: the worker has no inbound HTTP (ADR-034).

  admin:
    <<: *service
    image: ${REGISTRY:-bookone}/admin:${TAG:-latest}
    # Next writes its cache under .next/cache; everything else stays read-only.
    tmpfs: [/tmp, /app/apps/admin/.next/cache]
    environment:
      NODE_ENV: production
      # ADR-036: every service reports to the collector below.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      BOOKONE_ENVIRONMENT: ${BOOKONE_ENVIRONMENT:-prod}
      DATABASE_URL: ${DATABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      ADMIN_SUPABASE_URL: ${ADMIN_SUPABASE_URL:?}
      ADMIN_SUPABASE_ANON_KEY: ${ADMIN_SUPABASE_ANON_KEY:?}
    # Tailnet only: shares the tailscale container's network namespace and has
    # no published port on the host.
    network_mode: service:tailscale
    depends_on: [tailscale]

  # ADR-036: the one place telemetry leaves this host. It strips content and
  # URL secrets (infra/otel/collector.yaml) and ships to an EU backend.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yaml']
    environment:
      OTEL_BACKEND_ENDPOINT: ${OTEL_BACKEND_ENDPOINT:?}
      OTEL_BACKEND_AUTHORIZATION: ${OTEL_BACKEND_AUTHORIZATION:?}
    volumes:
      - ../otel/collector.yaml:/etc/otelcol/config.yaml:ro
    expose: ['4318']

  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: bookone-ops
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: 'false'
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    devices: [/dev/net/tun:/dev/net/tun]
    cap_add: [NET_ADMIN, SYS_MODULE]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_HOST: ${API_HOST:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]

volumes:
  tailscale-state:
  caddy-data:
